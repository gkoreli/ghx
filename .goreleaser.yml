version: 2
project_name: ghx

builds:
  - dir: v2
    binary: ghx
    ldflags:
      - -s -w -X github.com/gkoreli/ghx/v2/cmd.VERSION={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "ghx_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - v2/SKILL.md
      - v2/MCP-SKILL.md
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  github:
    owner: gkoreli
    name: ghx
  extra_files:
    - glob: v2/SKILL.md
    - glob: v2/MCP-SKILL.md

brews:
  - repository:
      owner: gkoreli
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: ghx
    homepage: https://github.com/gkoreli/ghx
    description: GitHub code exploration for AI agents
    install: |
      bin.install "ghx"
      prefix.install "SKILL.md"
      prefix.install "MCP-SKILL.md"
