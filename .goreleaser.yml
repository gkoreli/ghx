version: 2
project_name: ghx

builds:
  - main: ./cmd/ghx
    binary: ghx
    ldflags:
      - -s -w -X github.com/gkoreli/ghx/v2/internal/cli.VERSION={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "ghx_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: skills/ghx/SKILL.md
        strip_parent: true
      - src: skills/ghx-mcp/SKILL.md
        strip_parent: true
      - src: skills/ghx-recon/SKILL.md
        strip_parent: true
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  github:
    owner: gkoreli
    name: ghx
  extra_files:
    - glob: skills/ghx/SKILL.md
    - glob: skills/ghx-mcp/SKILL.md
    - glob: skills/ghx-recon/SKILL.md

brews:
  - repository:
      owner: gkoreli
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: auto
    name: ghx
    homepage: https://github.com/gkoreli/ghx
    description: GitHub code exploration for AI agents
    install: |
      bin.install "ghx"
      prefix.install "SKILL.md"
      prefix.install "MCP-SKILL.md"
