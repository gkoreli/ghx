name: Auto Tag and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version to publish to npm (without v)'
        required: true
        type: string
  push:
    branches:
      - mainline
    paths:
      - 'package.json'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: version
        run: |
          git fetch --tags
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CURRENT_VERSION="${{ inputs.version }}"
            CURRENT_VERSION="${CURRENT_VERSION#v}"
          else
            CURRENT_VERSION=$(node -p "require('./package.json').version")
          fi

          if ! echo "$CURRENT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version: $CURRENT_VERSION"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && ! git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag v$CURRENT_VERSION does not exist"
            exit 1
          fi

          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="v${{ steps.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  release:
    needs: tag
    if: needs.tag.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: v${{ needs.tag.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  npm:
    needs: [tag, release]
    if: ${{ always() && needs.tag.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.tag.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.tag.outputs.version }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - run: bash scripts/publish-npm.sh ${{ needs.tag.outputs.version }}
